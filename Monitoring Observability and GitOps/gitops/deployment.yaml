# The desired state ArgoCD reconciles the cluster against.
# Git is the source of truth: change this file, and the cluster follows.
# Name: Hemang | Enrollment number: 24bcs10209
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-demo
  namespace: gitops-demo
  labels: { app: gitops-demo }
spec:
  replicas: 4
  selector:
    matchLabels: { app: gitops-demo }
  template:
    metadata:
      labels: { app: gitops-demo }
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: "25m", memory: "32Mi" }
            limits:   { cpu: "200m", memory: "128Mi" }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gitops-demo
  namespace: gitops-demo
spec:
  selector: { app: gitops-demo }
  ports: [{ port: 80, targetPort: 80 }]
