apiVersion: v1
kind: Service
metadata:
  name: {{ include "notes-chart.fullname" . }}
  labels: {{- include "notes-chart.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "notes-chart.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
