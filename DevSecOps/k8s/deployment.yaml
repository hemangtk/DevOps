# Hardened deployment manifest for the CI/CD demo app.
# Name: Hemang | Enrollment number: 24bcs10209
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-demo
  labels: { app: cicd-demo }
spec:
  replicas: 2
  selector:
    matchLabels: { app: cicd-demo }
  template:
    metadata:
      labels: { app: cicd-demo }
    spec:
      securityContext:                 # pod-level hardening
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: devops-cicd-demo:latest
          ports: [{ containerPort: 5000 }]
          securityContext:             # container-level hardening
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: "50m",  memory: "64Mi" }
            limits:   { cpu: "300m", memory: "256Mi" }
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}                 # writable scratch, since root fs is read-only
---
apiVersion: v1
kind: Service
metadata:
  name: cicd-demo
spec:
  selector: { app: cicd-demo }
  ports: [{ port: 80, targetPort: 5000 }]
