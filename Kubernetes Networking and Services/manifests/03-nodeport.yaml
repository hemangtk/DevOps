# NodePort - opens a port on EVERY node, on top of a ClusterIP.
# Name: Hemang | Enrollment number: 24bcs10209
apiVersion: v1
kind: Service
metadata:
  name: backend-nodeport
  namespace: k8s-lab
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - name: http
      port: 80          # cluster-internal port
      targetPort: 80    # pod port
      nodePort: 30080   # port on the node (valid range 30000-32767)
