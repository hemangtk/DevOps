apiVersion: v1
kind: ConfigMap
metadata: { name: app-settings, namespace: s14 }
data:
  LOG_LEVEL: "INFO"
---
apiVersion: v1
kind: Pod
metadata: { name: config-broken, namespace: s14 }
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ['sh','-c','echo "DB_HOST=$DB_HOST"; sleep 3600']
      env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: app-settings
              key: DATABASE_HOST     # <-- this key does not exist
