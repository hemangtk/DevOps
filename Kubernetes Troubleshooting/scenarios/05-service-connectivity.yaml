# BROKEN: the Service selector does not match the Deployment's pod labels.
# The Service exists, resolves in DNS, and routes nowhere.
# Name: Hemang | Enrollment number: 24bcs10209
apiVersion: apps/v1
kind: Deployment
metadata: { name: web, namespace: s14 }
spec:
  replicas: 2
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }          # pods are labelled app=web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata: { name: web-svc-broken, namespace: s14 }
spec:
  selector: { app: webserver }      # <-- WRONG. No pod has this label.
  ports: [{ port: 80, targetPort: 80 }]
