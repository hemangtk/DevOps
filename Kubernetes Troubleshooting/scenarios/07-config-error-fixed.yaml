apiVersion: v1
kind: Pod
metadata: { name: config-fixed, namespace: s14 }
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ['sh','-c','echo "LOG_LEVEL=$LOG_LEVEL"; sleep 3600']
      env:
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: app-settings
              key: LOG_LEVEL
