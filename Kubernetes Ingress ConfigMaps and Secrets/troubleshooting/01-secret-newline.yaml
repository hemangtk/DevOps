# The base64 newline bug, as two Secrets that differ by one invisible byte.
# Name: Hemang | Enrollment number: 24bcs10209
apiVersion: v1
kind: Secret
metadata:
  name: db-good
type: Opaque
data:
  # echo -n 'secretpassword' | base64   ->  14 bytes
  PASSWORD: c2VjcmV0cGFzc3dvcmQ=
---
apiVersion: v1
kind: Secret
metadata:
  name: db-bad
type: Opaque
data:
  # echo    'secretpassword' | base64   ->  15 bytes, the last one is \n
  PASSWORD: c2VjcmV0cGFzc3dvcmQK
---
# The fix: let Kubernetes do the encoding.
apiVersion: v1
kind: Secret
metadata:
  name: db-stringdata
type: Opaque
stringData:
  PASSWORD: secretpassword
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: db-good, key: PASSWORD }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "postgres"] }
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
---
# Two clients, identical except for which Secret they read.
apiVersion: v1
kind: Pod
metadata:
  name: client-good
spec:
  restartPolicy: Never
  containers:
    - name: psql
      image: postgres:16-alpine
      command: ["psql", "-h", "postgres", "-U", "postgres", "-c", "select 1 as ok"]
      env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef: { name: db-good, key: PASSWORD }
---
apiVersion: v1
kind: Pod
metadata:
  name: client-bad
spec:
  restartPolicy: Never
  containers:
    - name: psql
      image: postgres:16-alpine
      command: ["psql", "-h", "postgres", "-U", "postgres", "-c", "select 1 as ok"]
      env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef: { name: db-bad, key: PASSWORD }
