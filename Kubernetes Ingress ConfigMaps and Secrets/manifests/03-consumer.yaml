# A pod that consumes the ConfigMap and Secret both ways:
# as environment variables, and as mounted files.
# Name: Hemang | Enrollment number: 24bcs10209
apiVersion: v1
kind: Pod
metadata:
  name: config-consumer
  namespace: k8s-lab
spec:
  restartPolicy: Never
  containers:
    - name: app
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "===== ENV FROM ConfigMap ====="
          echo "ENVIRONMENT      = $ENVIRONMENT"
          echo "LOG_LEVEL        = $LOG_LEVEL"
          echo "DEFAULT_CURRENCY = $DEFAULT_CURRENCY"
          echo "MAX_BOOKING_DAYS = $MAX_BOOKING_DAYS"
          echo
          echo "===== ENV FROM Secret (already decoded by kubelet) ====="
          echo "DB_USER     = $DB_USER"
          echo "DB_HOST     = $DB_HOST"
          echo "DB_PASSWORD = $DB_PASSWORD"
          echo
          echo "===== ConfigMap MOUNTED AS A FILE ====="
          ls -l /etc/appconfig/
          echo "--- contents of /etc/appconfig/app.properties ---"
          cat /etc/appconfig/app.properties
          echo
          echo "===== Secret MOUNTED AS FILES ====="
          ls -l /etc/dbsecret/
          echo "DB_USER file     -> $(cat /etc/dbsecret/DB_USER)"
          echo "DB_PASSWORD file -> $(cat /etc/dbsecret/DB_PASSWORD)"
          echo
          echo "===== the secret volume is tmpfs (RAM), never written to disk ====="
          mount | grep dbsecret || true
      envFrom:
        - configMapRef:
            name: app-config      # every key becomes an env var
      env:
        - name: DB_USER
          valueFrom:
            secretKeyRef: { name: db-secret, key: DB_USER }
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef: { name: db-secret, key: DB_PASSWORD }
        - name: DB_HOST
          valueFrom:
            secretKeyRef: { name: db-secret, key: DB_HOST }
      volumeMounts:
        - name: config-volume
          mountPath: /etc/appconfig
          readOnly: true
        - name: secret-volume
          mountPath: /etc/dbsecret
          readOnly: true
  volumes:
    - name: config-volume
      configMap:
        name: app-config
    - name: secret-volume
      secret:
        secretName: db-secret
