# Secret - same shape as a ConfigMap, but base64-ENCODED (not encrypted).
# Name: Hemang | Enrollment number: 24bcs10209
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: k8s-lab
type: Opaque
data:
  # echo -n 'admin' | base64          -> YWRtaW4=
  # echo -n 'S3cr3tP@ss' | base64     -> UzNjcjN0UEBzcw==
  DB_USER: YWRtaW4=
  DB_PASSWORD: UzNjcjN0UEBzcw==
stringData:
  # stringData takes PLAIN text and Kubernetes encodes it for you.
  # Much less error-prone than hand-running base64.
  DB_HOST: "mysql.k8s-lab.svc.cluster.local"
