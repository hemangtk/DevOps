# ConfigMap - plain-text, non-sensitive configuration.
# Name: Hemang | Enrollment number: 24bcs10209
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: k8s-lab
data:
  # simple key/value pairs -> injected as environment variables
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  DEFAULT_CURRENCY: "INR"
  MAX_BOOKING_DAYS: "30"

  # a whole file -> mounted as a volume
  app.properties: |
    server.port=8080
    server.timeout=30s
    feature.newCheckout=true
