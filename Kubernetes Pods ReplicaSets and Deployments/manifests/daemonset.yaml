# A DaemonSet: exactly one Pod per eligible node. You never set replicas -
# the node count IS the replica count.
# Name: Hemang | Enrollment number: 24bcs10209
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
  labels: { app: node-agent }
spec:
  selector:
    matchLabels: { app: node-agent }
  template:
    metadata:
      labels: { app: node-agent }
    spec:
      # a log shipper or metrics agent would need the node's filesystem;
      # this reads the node name instead, which is enough to prove placement.
      containers:
        - name: agent
          image: busybox:1.36
          command:
            - sh
            - -c
            - 'echo "agent running on node $NODE_NAME"; while true; do sleep 30; done'
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef: { fieldPath: spec.nodeName }
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits: { cpu: "100m", memory: "64Mi" }

      # control-plane nodes carry a NoSchedule taint. A Deployment would simply
      # skip them; a node agent usually needs to run there too, so it tolerates it.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
