# Recreate: kill every old pod FIRST, then start the new ones. Causes downtime.
# Name: Hemang | Enrollment number: 24bcs10209
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-recreate
  namespace: k8s-lab
spec:
  replicas: 3
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: web-recreate }
  template:
    metadata:
      labels: { app: web-recreate }
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports: [{ containerPort: 80 }]
