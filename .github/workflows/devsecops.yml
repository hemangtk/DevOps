# Session 17: CI/CD + DevSecOps pipeline with security gates.
# Name: Hemang | Enrollment number: 24bcs10209
#
# Flow: Build -> Unit Test -> SAST -> SCA -> Secret Scan -> Docker Build
#       -> Image Scan -> Security Gate -> Push -> Deploy
name: DevSecOps Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'CICD and GitHub Actions/**'
      - 'DevSecOps/**'
      - '.github/workflows/devsecops.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write     # needed to upload SARIF to the Security tab

env:
  APP_DIR: CICD and GitHub Actions
  IMAGE_NAME: devops-cicd-demo

jobs:
  # ============================================================ BUILD + TEST
  build-test:
    name: Build and unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: pip install -r requirements-dev.txt
      - name: Unit tests
        working-directory: ${{ env.APP_DIR }}
        run: pytest --cov=app --cov-report=term

  # ============================================================ SAST
  sast:
    name: SAST (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install bandit[sarif]
      - name: Scan our own source for insecure patterns
        working-directory: ${{ env.APP_DIR }}
        # -ll = report medium severity and above; app code only, not tests
        run: |
          bandit -r app -ll -f txt | tee bandit.txt
          echo "exit=$?"
      - name: Also emit SARIF for the Security tab
        working-directory: ${{ env.APP_DIR }}
        continue-on-error: true
        run: bandit -r app -ll -f sarif -o bandit.sarif || true
      - uses: actions/upload-artifact@v4
        with:
          name: sast-report
          path: ${{ env.APP_DIR }}/bandit.txt

  # ============================================================ SCA
  sca:
    name: SCA (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pip-audit
      - name: Audit third-party dependencies for known CVEs
        working-directory: ${{ env.APP_DIR }}
        run: pip-audit -r requirements.txt --desc 2>&1 | tee sca.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sca-report
          path: ${{ env.APP_DIR }}/sca.txt

  # ============================================================ SECRET SCAN
  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }      # full history - secrets hide in old commits
      - name: Run gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --no-banner --redact \
            --config DevSecOps/security/.gitleaks.toml \
            --report-path gitleaks.json --exit-code 1 \
            && echo "GITLEAKS: no secrets found" \
            || { echo "GITLEAKS: findings above"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secret-scan-report
          path: gitleaks.json

  # ============================================================ IMAGE SCAN
  image-scan:
    name: Container image scan (Trivy)
    runs-on: ubuntu-latest
    needs: [build-test]
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        working-directory: ${{ env.APP_DIR }}
        run: docker build -t ${{ env.IMAGE_NAME }}:scan .

      - name: Trivy - full report (informational)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:scan
          format: table
          output: trivy-report.txt
          severity: 'LOW,MEDIUM,HIGH,CRITICAL'
          exit-code: '0'

      - name: Show the report
        run: cat trivy-report.txt

      - name: Trivy - THE GATE (fail on CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:scan
          format: table
          severity: 'CRITICAL'
          ignore-unfixed: true      # don't block on CVEs with no patch available
          exit-code: '1'            # <-- this is what makes it a gate

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-scan-report
          path: trivy-report.txt

  # ============================================================ SECURITY GATE
  security-gate:
    name: Security gate
    runs-on: ubuntu-latest
    needs: [build-test, sast, sca, secret-scan, image-scan]
    if: always()
    steps:
      - name: Evaluate every security stage
        run: |
          echo "build-test  : ${{ needs.build-test.result }}"
          echo "sast        : ${{ needs.sast.result }}"
          echo "sca         : ${{ needs.sca.result }}"
          echo "secret-scan : ${{ needs.secret-scan.result }}"
          echo "image-scan  : ${{ needs.image-scan.result }}"
          if [ "${{ needs.build-test.result }}"  != "success" ] || \
             [ "${{ needs.sast.result }}"        != "success" ] || \
             [ "${{ needs.sca.result }}"         != "success" ] || \
             [ "${{ needs.secret-scan.result }}" != "success" ] || \
             [ "${{ needs.image-scan.result }}"  != "success" ]; then
            echo "SECURITY GATE: FAILED - deployment blocked"
            exit 1
          fi
          echo "SECURITY GATE: PASSED - safe to deploy"

      - name: Write the gate summary
        if: always()
        run: |
          {
            echo "## DevSecOps gate"
            echo ""
            echo "| Stage | Tool | Result |"
            echo "|---|---|---|"
            echo "| Unit tests   | pytest    | ${{ needs.build-test.result }} |"
            echo "| SAST         | bandit    | ${{ needs.sast.result }} |"
            echo "| SCA          | pip-audit | ${{ needs.sca.result }} |"
            echo "| Secret scan  | gitleaks  | ${{ needs.secret-scan.result }} |"
            echo "| Image scan   | Trivy     | ${{ needs.image-scan.result }} |"
            echo ""
            echo "Hemang - 24bcs10209"
          } >> $GITHUB_STEP_SUMMARY

  # ============================================================ DEPLOY
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [security-gate]           # <-- cannot run unless the gate passed
    steps:
      - uses: actions/checkout@v4
      - name: Validate the Kubernetes manifests
        run: |
          curl -sSLo kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          ./kubeconform -strict -summary DevSecOps/k8s/
      - name: Deployment step (no cluster attached in CI)
        run: |
          echo "Manifests validated. In a real pipeline this step would run:"
          echo "  kubectl apply -f DevSecOps/k8s/"
          echo "against a cluster reached with a KUBECONFIG secret or OIDC."
          echo "Session 21 wires this to a live cluster."
