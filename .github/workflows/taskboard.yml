# Session 21 capstone pipeline - TaskBoard.
# Test -> security -> build+push to GHCR -> scan -> gate -> deploy manifests.
# Name: Hemang | Enrollment number: 24bcs10209
name: TaskBoard Capstone

on:
  push:
    branches: [main]
    paths:
      - 'Final DevOps Project/**'
      - '.github/workflows/taskboard.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write          # required to push to GHCR

env:
  PROJECT_DIR: Final DevOps Project/taskboard
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/taskboard-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/taskboard-frontend

jobs:
  # ====================================================== M2: TEST
  test:
    name: Lint and test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}/backend
        run: pip install -r requirements-dev.txt

      - name: flake8
        working-directory: ${{ env.PROJECT_DIR }}/backend
        run: flake8 app tests --max-line-length=100 --show-source --statistics

      - name: pytest
        working-directory: ${{ env.PROJECT_DIR }}/backend
        run: pytest --cov=app --cov-report=term --cov-report=xml

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: ${{ env.PROJECT_DIR }}/backend/coverage.xml
          retention-days: 7

  # ====================================================== FRONTEND BUILD
  frontend-build:
    name: Build the frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ env.PROJECT_DIR }}/frontend/package.json

      - name: npm install
        working-directory: ${{ env.PROJECT_DIR }}/frontend
        run: npm install

      - name: vite build
        working-directory: ${{ env.PROJECT_DIR }}/frontend
        run: |
          npm run build
          echo "--- build output ---"
          ls -la dist dist/assets

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ${{ env.PROJECT_DIR }}/frontend/dist
          retention-days: 7

  # ====================================================== M6: SECURITY (source)
  security:
    name: SAST, SCA and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install bandit pip-audit

      - name: SAST (bandit)
        working-directory: ${{ env.PROJECT_DIR }}/backend
        run: bandit -r app -ll

      - name: SCA (pip-audit)
        working-directory: ${{ env.PROJECT_DIR }}/backend
        run: pip-audit -r requirements.txt --desc

      - name: Secret scan (gitleaks, full history)
        run: |
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --no-banner --redact \
            --config DevSecOps/security/.gitleaks.toml --exit-code 1

  # ====================================================== M4+M5+M6: IMAGES
  images:
    name: Build, scan and push both images
    runs-on: ubuntu-latest
    needs: [test, frontend-build]
    outputs:
      sha_tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute the image tag from the commit SHA
        id: meta
        run: echo "sha_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build backend
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          docker build -f backend/Dockerfile \
            --build-arg APP_VERSION=${{ steps.meta.outputs.sha_tag }} \
            -t "$BACKEND_IMAGE:${{ steps.meta.outputs.sha_tag }}" backend

      - name: Build frontend
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          docker build -f frontend/Dockerfile \
            -t "$FRONTEND_IMAGE:${{ steps.meta.outputs.sha_tag }}" frontend

      - name: Smoke test the backend image
        run: |
          docker run -d --name smoke -p 8000:8000 "$BACKEND_IMAGE:${{ steps.meta.outputs.sha_tag }}"
          for i in $(seq 1 25); do curl -sf localhost:8000/health >/dev/null && break || sleep 2; done
          echo "--- /health ---"; curl -s localhost:8000/health; echo
          echo "--- POST /api/tasks ---"
          curl -s -X POST -H 'Content-Type: application/json' \
            -d '{"title":"from CI"}' localhost:8000/api/tasks; echo
          echo "--- GET /api/tasks ---"; curl -s localhost:8000/api/tasks; echo
          echo "--- /metrics ---"; curl -s localhost:8000/metrics | head -3
          docker rm -f smoke

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin v0.75.0

      - name: Trivy report (informational, both images)
        run: |
          for img in "$BACKEND_IMAGE" "$FRONTEND_IMAGE"; do
            echo "=============== $img ==============="
            trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 0 \
              --no-progress --format table "$img:${{ steps.meta.outputs.sha_tag }}" | head -30
          done

      - name: THE GATE - fail on fixable HIGH or CRITICAL, on BOTH images
        run: |
          for img in "$BACKEND_IMAGE" "$FRONTEND_IMAGE"; do
            echo "--- gating $img ---"
            trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
              --exit-code 1 --no-progress "$img:${{ steps.meta.outputs.sha_tag }}"
          done
          echo "image scan gate: PASSED (no fixable HIGH/CRITICAL in either image)"

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push both images, tagged with the commit SHA
        if: github.event_name == 'push'
        run: |
          docker push "$BACKEND_IMAGE:${{ steps.meta.outputs.sha_tag }}"
          docker push "$FRONTEND_IMAGE:${{ steps.meta.outputs.sha_tag }}"
          echo "pushed:"
          echo "  $BACKEND_IMAGE:${{ steps.meta.outputs.sha_tag }}"
          echo "  $FRONTEND_IMAGE:${{ steps.meta.outputs.sha_tag }}"

  # ====================================================== M8: MANIFESTS
  manifests:
    name: Validate manifests and chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: kubeconform on k8s/
        run: |
          curl -sSLo kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          ./kubeconform -strict -summary "$PROJECT_DIR/k8s/"

      - name: helm lint + template (all three value sets)
        run: |
          curl -sSL https://get.helm.sh/helm-v3.16.2-linux-amd64.tar.gz | tar -xz
          HELM=./linux-amd64/helm
          $HELM lint "$PROJECT_DIR/helm/taskboard"
          $HELM lint "$PROJECT_DIR/helm/taskboard" -f "$PROJECT_DIR/helm/taskboard/values-dev.yaml"
          $HELM lint "$PROJECT_DIR/helm/taskboard" -f "$PROJECT_DIR/helm/taskboard/values-prod.yaml"
          $HELM template tb "$PROJECT_DIR/helm/taskboard" > rendered.yaml
          ./kubeconform -strict -summary -ignore-missing-schemas rendered.yaml

      - name: terraform fmt + validate
        run: |
          curl -sSLo tf.zip https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_linux_amd64.zip
          unzip -qo tf.zip && chmod +x terraform
          cd "$PROJECT_DIR/terraform"
          "$GITHUB_WORKSPACE/terraform" fmt -check -recursive
          "$GITHUB_WORKSPACE/terraform" init -backend=false -no-color
          "$GITHUB_WORKSPACE/terraform" validate -no-color

  # ====================================================== GATE
  gate:
    name: Release gate
    runs-on: ubuntu-latest
    needs: [test, frontend-build, security, images, manifests]
    if: always()
    steps:
      - name: Evaluate every stage
        run: |
          fail=0
          for s in "test:${{ needs.test.result }}" \
                   "frontend-build:${{ needs.frontend-build.result }}" \
                   "security:${{ needs.security.result }}" \
                   "images:${{ needs.images.result }}" \
                   "manifests:${{ needs.manifests.result }}"; do
            name="${s%%:*}"; res="${s##*:}"
            printf '  %-16s %s\n' "$name" "$res"
            [ "$res" != "success" ] && fail=1
          done
          if [ "$fail" = "1" ]; then echo "RELEASE GATE: FAILED"; exit 1; fi
          echo "RELEASE GATE: PASSED"

      - name: Summary
        if: always()
        run: |
          {
            echo "## TaskBoard capstone pipeline"
            echo ""
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Lint and test (pytest) | ${{ needs.test.result }} |"
            echo "| Frontend build         | ${{ needs.frontend-build.result }} |"
            echo "| SAST / SCA / secrets   | ${{ needs.security.result }} |"
            echo "| Images + Trivy + GHCR  | ${{ needs.images.result }} |"
            echo "| Manifests and chart    | ${{ needs.manifests.result }} |"
            echo ""
            echo "Images tagged \`${{ needs.images.outputs.sha_tag }}\` (commit SHA, not latest)."
            echo ""
            echo "Hemang - 24bcs10209"
          } >> $GITHUB_STEP_SUMMARY
