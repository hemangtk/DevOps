# Session 21 capstone pipeline: CI -> security gates -> manifest validation.
# Name: Hemang | Enrollment number: 24bcs10209
name: Capstone Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'Final DevOps Project/**'
      - '.github/workflows/capstone.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  APP_DIR: Final DevOps Project/final-devops-project

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}/application
        run: pip install -r requirements-dev.txt
      - name: Lint
        working-directory: ${{ env.APP_DIR }}/application
        run: flake8 app tests --max-line-length=100
      - name: Unit tests
        working-directory: ${{ env.APP_DIR }}/application
        run: pytest --cov=app --cov-report=term

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install bandit pip-audit
      - name: SAST
        working-directory: ${{ env.APP_DIR }}/application
        run: bandit -r app -ll
      - name: SCA
        working-directory: ${{ env.APP_DIR }}/application
        run: pip-audit -r requirements.txt
      - name: Secret scan
        run: |
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --no-banner --redact \
            --config DevSecOps/security/.gitleaks.toml --exit-code 1

  image:
    name: Image build and scan
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        working-directory: ${{ env.APP_DIR }}
        run: docker build -f docker/Dockerfile --build-arg APP_VERSION=${{ github.sha }} -t taskboard:ci .
      - name: Smoke test
        run: |
          docker run -d --name smoke -p 8000:8000 taskboard:ci
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/health > /dev/null && break || sleep 2
          done
          echo "--- /health ---";  curl -s http://localhost:8000/health;  echo
          echo "--- /ready ---";   curl -s http://localhost:8000/ready;   echo
          echo "--- create a task ---"
          curl -s -X POST -H 'Content-Type: application/json' \
            -d '{"title":"from CI"}' http://localhost:8000/api/tasks; echo
          echo "--- metrics ---"; curl -s http://localhost:8000/metrics | head -3
          docker rm -f smoke
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin v0.75.0
      - name: Image scan gate
        run: |
          trivy image --scanners vuln --severity CRITICAL --ignore-unfixed \
            --exit-code 1 --no-progress taskboard:ci
          echo "image scan gate: passed"

  manifests:
    name: Validate manifests and chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: kubeconform
        run: |
          curl -sSLo kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          ./kubeconform -strict -summary -skip NetworkPolicy "$APP_DIR/kubernetes/"
      - name: helm lint
        run: |
          curl -sSL https://get.helm.sh/helm-v3.16.2-linux-amd64.tar.gz | tar -xz
          ./linux-amd64/helm lint "$APP_DIR/helm/taskboard"

  gate:
    name: Release gate
    runs-on: ubuntu-latest
    needs: [test, security, image, manifests]
    if: always()
    steps:
      - name: Evaluate
        run: |
          echo "test      : ${{ needs.test.result }}"
          echo "security  : ${{ needs.security.result }}"
          echo "image     : ${{ needs.image.result }}"
          echo "manifests : ${{ needs.manifests.result }}"
          if [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.security.result }}" != "success" ] || \
             [ "${{ needs.image.result }}" != "success" ] || \
             [ "${{ needs.manifests.result }}" != "success" ]; then
            echo "RELEASE GATE: FAILED"; exit 1
          fi
          echo "RELEASE GATE: PASSED"
      - name: Summary
        if: always()
        run: |
          {
            echo "## Capstone pipeline"
            echo ""
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Build and test       | ${{ needs.test.result }} |"
            echo "| Security scans       | ${{ needs.security.result }} |"
            echo "| Image build and scan | ${{ needs.image.result }} |"
            echo "| Manifests and chart  | ${{ needs.manifests.result }} |"
            echo ""
            echo "Hemang - 24bcs10209"
          } >> $GITHUB_STEP_SUMMARY
