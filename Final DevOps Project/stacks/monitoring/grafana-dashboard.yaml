# A Grafana dashboard with live Stacks panels, shipped as a ConfigMap.
#   kubectl apply -f monitoring/grafana-dashboard.yaml -n monitoring
# Name: Hemang | Enrollment number: 24bcs10209
apiVersion: v1
kind: ConfigMap
metadata:
  name: stacks-grafana-dashboard
  labels:
    grafana_dashboard: "1"
data:
  stacks.json: |
    {
      "title": "Stacks",
      "uid": "stacks",
      "timezone": "browser",
      "refresh": "10s",
      "time": { "from": "now-30m", "to": "now" },
      "panels": [
        {
          "type": "stat", "title": "Requests / sec",
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 0 },
          "targets": [
            { "expr": "sum(rate(stacks_http_requests_total[5m]))", "legendFormat": "rps" }
          ]
        },
        {
          "type": "stat", "title": "Copies on loan",
          "gridPos": { "h": 6, "w": 6, "x": 6, "y": 0 },
          "targets": [ { "expr": "max(stacks_books_total{state=\"borrowed\"})" } ]
        },
        {
          "type": "stat", "title": "Backend pods UP",
          "gridPos": { "h": 6, "w": 6, "x": 12, "y": 0 },
          "targets": [ { "expr": "sum(up{job=\"stacks-pods\"})" } ]
        },
        {
          "type": "stat", "title": "Errors (5xx, excl. probes)",
          "gridPos": { "h": 6, "w": 3, "x": 18, "y": 0 },
          "targets": [ { "expr": "sum(stacks_http_errors_total)" } ]
        },
        {
          "type": "stat", "title": "Readiness 503s",
          "gridPos": { "h": 6, "w": 3, "x": 21, "y": 0 },
          "targets": [ { "expr": "sum(stacks_not_ready_total)" } ]
        },
        {
          "type": "timeseries", "title": "HTTP request rate",
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 6 },
          "targets": [
            { "expr": "sum by (pod) (rate(stacks_http_requests_total[2m]))",
              "legendFormat": "{{pod}}" }
          ]
        },
        {
          "type": "timeseries", "title": "Average request latency",
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 6 },
          "targets": [
            { "expr": "avg by (pod) (stacks_request_latency_seconds)",
              "legendFormat": "{{pod}}" }
          ],
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "type": "timeseries", "title": "The shelf over time",
          "gridPos": { "h": 9, "w": 24, "x": 0, "y": 15 },
          "targets": [
            { "expr": "max(stacks_books_total{state=\"available\"})", "legendFormat": "on the shelf" },
            { "expr": "max(stacks_books_total{state=\"borrowed\"})", "legendFormat": "on loan" },
            { "expr": "max(stacks_books_overdue)", "legendFormat": "overdue" }
          ]
        }
      ]
    }
