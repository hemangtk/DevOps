# Production overrides - more replicas, headroom, metrics scraping on.
# Name: Hemang | Enrollment number: 24bcs10209
environment: production
logLevel: WARNING

backend:
  replicaCount: 3
  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits:   { cpu: "1",  memory: 1Gi }
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 12
    targetCPUUtilizationPercentage: 60

frontend:
  replicaCount: 3

postgres:
  persistence: { size: 20Gi }

serviceMonitor:
  enabled: true
