{{/* Demo credentials only - production uses Sealed Secrets / ESO.
     Name: Hemang | 24bcs10209 */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "stacks.fullname" . }}-secret
  labels: {{- include "stacks.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.secrets.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
