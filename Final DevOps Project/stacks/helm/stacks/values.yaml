# Default values. Override per environment with values-dev.yaml / values-prod.yaml.
# Name: Hemang | Enrollment number: 24bcs10209

nameOverride: ""
environment: production
logLevel: INFO

backend:
  replicaCount: 2
  image:
    repository: ghcr.io/hemangtk/stacks-backend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    port: 8000
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 60

frontend:
  replicaCount: 2
  image:
    repository: ghcr.io/hemangtk/stacks-frontend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    port: 3000
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits:   { cpu: 200m, memory: 256Mi }
  autoscaling:
    enabled: false

postgres:
  enabled: true
  image: postgres:16-alpine
  database: stacks
  persistence:
    enabled: true
    size: 1Gi
    storageClass: standard
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 512Mi }

# Demo values only. In production these come from Sealed Secrets or the
# External Secrets Operator - never from a values file in git.
secrets:
  postgresUser: stacks
  postgresPassword: change-me-in-production

ingress:
  enabled: true
  className: nginx
  host: stacks.local
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1

serviceMonitor:
  enabled: false        # requires the Prometheus Operator CRDs
