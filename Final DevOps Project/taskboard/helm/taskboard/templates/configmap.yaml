{{/* Non-sensitive config. Name: Hemang | 24bcs10209 */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "taskboard.fullname" . }}-config
  labels: {{- include "taskboard.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.environment | quote }}
  LOG_LEVEL: {{ .Values.logLevel | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_HOST: {{ include "taskboard.fullname" . }}-postgres
  POSTGRES_PORT: "5432"
