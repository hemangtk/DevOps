{{- if .Values.ingress.enabled }}
{{/* One entry point: / -> frontend, /api -> backend.
     Name: Hemang | 24bcs10209 */}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "taskboard.fullname" . }}
  labels: {{- include "taskboard.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          # /api/... keeps its prefix: FastAPI routes are mounted at /api
          - path: /(api/.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "taskboard.fullname" . }}-backend
                port: { number: {{ .Values.backend.service.port }} }
          - path: /(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "taskboard.fullname" . }}-frontend
                port: { number: {{ .Values.frontend.service.port }} }
{{- end }}
