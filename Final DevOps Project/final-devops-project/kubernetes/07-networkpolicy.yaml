# Defence in depth: only the app may reach postgres.
# Name: Hemang | Enrollment number: 24bcs10209
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-allow-app-only
  namespace: taskboard
spec:
  podSelector:
    matchLabels: { app: postgres }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: taskboard }
      ports:
        - protocol: TCP
          port: 5432
