# The TaskBoard application: Deployment + Service.
# Demonstrates ConfigMap + Secret injection, all three probes, resource
# requests (required for the HPA), and a hardened securityContext.
# Name: Hemang | Enrollment number: 24bcs10209
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskboard
  namespace: taskboard
  labels: { app: taskboard }
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }   # never drop below 2
  selector:
    matchLabels: { app: taskboard }
  template:
    metadata:
      labels: { app: taskboard }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }

      # wait for postgres before the app container starts
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -p 5432 -U "$POSTGRES_USER"; do
                echo "waiting for postgres..."; sleep 2
              done
              echo "postgres is ready"
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: taskboard-secret, key: POSTGRES_USER } }

      containers:
        - name: api
          image: taskboard:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8000, name: http }]

          env:
            - name: APP_VERSION
              value: "1.0.0"
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: taskboard-secret, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: taskboard-secret, key: POSTGRES_PASSWORD } }
            - name: POSTGRES_DB
              valueFrom: { configMapKeyRef: { name: taskboard-config, key: POSTGRES_DB } }
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)"
          envFrom:
            - configMapRef: { name: taskboard-config }

          resources:
            requests: { cpu: "50m",  memory: "64Mi" }    # HPA measures against this
            limits:   { cpu: "300m", memory: "256Mi" }

          startupProbe:                 # allow a slow first boot
            httpGet: { path: /health, port: 8000 }
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:               # checks the DATABASE - gates traffic
            httpGet: { path: /ready, port: 8000 }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:                # process only - does NOT check the DB
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }

          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}                  # writable scratch for a read-only root fs
---
apiVersion: v1
kind: Service
metadata:
  name: taskboard
  namespace: taskboard
  labels: { app: taskboard }
spec:
  type: ClusterIP
  selector: { app: taskboard }
  ports: [{ name: http, port: 80, targetPort: 8000 }]
