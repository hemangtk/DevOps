# Prometheus scrape config for the app. The pods already carry the
# prometheus.io/* annotations; this is the Prometheus Operator equivalent.
# Name: Hemang | Enrollment number: 24bcs10209
apiVersion: v1
kind: ConfigMap
metadata:
  name: taskboard-scrape-config
  namespace: taskboard
data:
  scrape.yml: |
    scrape_configs:
      - job_name: taskboard
        kubernetes_sd_configs:
          - role: pod
            namespaces: { names: [taskboard] }
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            target_label: __metrics_path__
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
