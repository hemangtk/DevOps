# ArgoCD Application for the capstone - git is the source of truth.
# Name: Hemang | Enrollment number: 24bcs10209
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: taskboard
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hemangtk/DevOps.git
    targetRevision: main
    path: Final DevOps Project/final-devops-project/kubernetes
  destination:
    server: https://kubernetes.default.svc
    namespace: taskboard
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
